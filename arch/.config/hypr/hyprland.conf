################
### MONITORS ###
################
# Tu laptop forzada a 120Hz y tu HDMI a 165Hz
monitor = eDP-1, 2560x1600@120, 0x0, 1.25
monitor = HDMI-A-1, 1920x1080@144, 2048x200, 1

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$editor = zed
$browser = brave-origin-nightly --enable-features=TouchpadOverscrollHistoryNavigation --ozone-platform=wayland --use-gl=egl

#################
### AUTOSTART ###
#################
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = swww-daemon
exec-once = waypaper --restore

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# --- VARIABLES NVIDIA ---
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm

#####################
### LOOK AND FEEL ###
#####################
# (Extraído exactamente de tus capturas)
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    
    # Borde activo estilo Koda: blanco limpio
    col.active_border = rgba(ffffffff) rgba(ffffffff) 45deg
    
    # Borde inactivo transparente como en SalarAlo/dotfiles
    col.inactive_border = rgba(00000000)
    
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2
    active_opacity = 1
    inactive_opacity = .98
    
    shadow {
        enabled = false
    }
    
    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = smoothOut, 0.25, 0.9, 0.35, 1.0
    bezier = smoothInOut, 0.4, 0.0, 0.2, 1.0
    bezier = subtle, 0.22, 0.9, 0.3, 1.0
    bezier = stylish, 0.2, 1.0, 0.15, 1.0

    animation = windows, 1, 6, stylish, popin 96%
    animation = windowsOut, 1, 5, smoothInOut, popin 96%
    animation = border, 1, 9, subtle
    animation = fade, 1, 5, smoothInOut
    animation = layers, 1, 5, subtle
    animation = layersIn, 1, 5, subtle, slide bottom
    animation = layersOut, 1, 4, smoothInOut, slide bottom
    animation = fadeLayersIn, 1, 4, subtle
    animation = fadeLayersOut, 1, 4, smoothInOut
    animation = workspaces, 1, 6, stylish, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

group {
    col.border_active = rgba(ffffffff)
    col.border_inactive = rgba(ffffff66)
    col.border_locked_active = rgba(ffffffff)
    col.border_locked_inactive = rgba(ffffff66)

    groupbar {
        text_color = rgba(ffffffff)
        col.active = rgba(ffffffff)
        col.inactive = rgba(ffffff66)
        col.locked_active = rgba(ffffffff)
        col.locked_inactive = rgba(ffffff66)
    }
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_variant = altgr-intl
    follow_mouse = 1
    sensitivity = 0 
    accel_profile = flat
    repeat_rate = 60
    repeat_delay = 375
    
    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}

gesture = 3, horizontal, workspace

# Tu touchpad sin aceleración
device {
    name = pixa3804:01-093a:3804-touchpad
    sensitivity = 0.5
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

# --- APLICACIONES PRINCIPALES ---
bind = $mainMod, Q, killactive,
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, rofi -show drun
bind = ALT, SPACE, exec, $menu

# --- SISTEMA ---
bind = $mainMod SHIFT, M, exit,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, togglefloating,
bind = $mainMod CTRL, F, fullscreen,
bind = $mainMod, R, exec, hyprctl reload

# --- ENFOQUE ESTILO VIM ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- MOVER VENTANAS ESTILO VIM ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# --- CAPTURA DE PANTALLA ---
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# --- GRUPOS ---
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup

# --- NAVEGACIÓN DE ESPACIOS DE TRABAJO (1 al 5) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# --- MOVER VENTANAS A ESPACIOS ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- SUBMAP DE REDIMENSIONADO ESTILO SALARALO ---
bind = $mainMod CTRL, R, submap, resize
submap = resize
bind = , H, resizeactive, -30 0
bind = , L, resizeactive, 30 0
bind = , K, resizeactive, 0 -30
bind = , J, resizeactive, 0 30
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

# --- AGRANDAR Y ACHICAR INTELIGENTE (Grow/Shrink) ---
binde = $mainMod SHIFT, equal, resizeactive, 50 50
binde = $mainMod SHIFT, minus, resizeactive, -50 -50

# --- MULTIMEDIA Y BRILLO ---
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# --- REDIMENSIONAR (Mantenlo con flechas por comodidad) ---
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    
    opacity = 0.90 0.98
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

xwayland {
    force_zero_scaling = true
}
