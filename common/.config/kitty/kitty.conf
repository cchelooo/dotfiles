# --- FUENTE ---
# font_family      JetBrainsMono Nerd Font Mono
font_size        12.0

# --- APARIENCIA GENERAL ---
background_opacity 1.0
window_padding_width 10

# (EXCLUSIVO DE MAC) Oculta la barra de título superior para un look 100% tiling
hide_window_decorations titlebar-only

# --- COLORES EXTRACTOS DE OBSIDIAN (100% MONOCROMÁTICO) ---
background #050505
foreground #d4d4d4
selection_background #242424
selection_foreground #ffffff
cursor #d6d6d6

# Negro y Gris oscuro (Fondos y base)
color0 #0a0a0a
color8 #242424

# Reemplazo total del arcoíris ANSI por la escala de grises de Obsidian
color1 #333333
color9 #404040
color2 #4d4d4d
color10 #595959
color3 #666666
color11 #737373
color4 #7f7f7f
color12 #868686
color5 #8d8d8d
color13 #9a9a9a
color6 #9f9f9f
color14 #c8c8c8

# Gris claro y Blanco puro (Texto y resaltados)
color7 #d4d4d4
color15 #ffffff


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS